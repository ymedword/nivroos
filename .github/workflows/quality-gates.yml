# 质量门禁：push/PR 触发构建 + Google 格式检查（spotless:check）+ SpotBugs + 测试 + JaCoCo 报告。
# 重扫描不进默认流程（OWASP dependency-check 需分钟级 NVD 下载），手动/夜间执行：
#   mvn -Psecurity verify（设 NVD_API_KEY 环境变量可加速）
name: Quality gates

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and verify
        run: mvn -B --no-transfer-progress verify
