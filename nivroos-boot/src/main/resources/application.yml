# NivroOS runtime configuration
#
# Per the constitution, secrets are NEVER written here — only ${ENV_VAR} references.
# Runtime settings are overridable via environment variables or command-line arguments
# (e.g. --spring.datasource.url=...).

spring:
  application:
    name: nivroos
  config:
    # FR-003 双通道之二：独立本地配置文件（不入 git，见根 .gitignore）。
    # 文件缺失不影响启动；存在时其明文 api-key 会被 ProviderProperties 放行
    import: optional:file:./nivroos-secrets.yml
  # 原则二/三：禁用 Spring AI eager 自动装配。OpenAI 系 starter（DeepSeek/Kimi 走 OpenAI
  # 兼容通道）会急切创建 ChatModel 并索要 api-key，绕过 ProviderService 的显式映射；
  # US-1 接入后此排除必须保留。
  autoconfigure:
    exclude:
      - org.springframework.ai.autoconfigure.openai.OpenAiAutoConfiguration
      # DeepSeek starter 的 eager 装配同样必须排除：它按 spring.ai.deepseek.* 索要
      # api-key 并自建 ChatModel，绕过显式映射（CLAUDE.md 陷阱表，2026-08-31 实测）
      - org.springframework.ai.model.deepseek.autoconfigure.DeepSeekChatAutoConfiguration
      # OpenAI 兼容通道（Kimi）的六个 eager 装配全部排除：ChatModel 由
      # ProviderAutoConfiguration 显式构造（2026-08-31 实测逐一触发）
      - org.springframework.ai.model.openai.autoconfigure.OpenAiChatAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiEmbeddingAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiImageAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioTranscriptionAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiModerationAutoConfiguration
  threads:
    virtual:
      enabled: true   # 原则七：同步执行模型 + JDK 21 虚拟线程扛并发
  datasource:
    # SQLite is not in Spring Boot's embedded-database list, so the driver
    # class must be explicit. The file is created on first access.
    url: jdbc:sqlite:${NIVROOS_DB:./nivroos.db}
    driver-class-name: org.sqlite.JDBC
    hikari:
      data-source-properties:
        journal_mode: WAL        # SQLite 写并发（读不阻塞写）
        busy_timeout: 5000       # 锁等待，避免虚拟线程并发写时报 database is locked
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      # 表结构唯一权威是 schema.sql（幂等 CREATE TABLE IF NOT EXISTS）；
      # SQLite 下 Hibernate ALTER TABLE 支持很弱，不用 ddl-auto=update 迁移
      # （CLAUDE.md 常见陷阱表）。
      ddl-auto: none
    open-in-view: false
  sql:
    init:
      mode: always   # 启动执行 schema.sql

  ai:
    dashscope:
      # Skeleton phase: disabled until ProviderService (US-1) wires the explicit
      # name-to-ChatModel mapping. API keys are injected via ${ENV_VAR} only.
      enabled: false

# 核心能力一（US-1）：供应商全局注册（契约见 specs/001-llm-provider/contracts/provider-config.md）。
# api-key 只允许 ${ENV_VAR} 占位，明文会被 ProviderProperties 校验拒绝（宪法：不明文落盘）。
nivroos:
  providers:
    deepseek:
      api-key: ${DEEPSEEK_API_KEY}
    kimi:
      # 无官方 GA starter，经 OpenAI 兼容端点接入（实测 2026-08-27）
      # 注意：OpenAiApi 自行追加 /v1 路径，base-url 不得带 /v1（会 404 /v1/v1，2026-08-31 实测）
      api-key: ${KIMI_API_KEY}
      base-url: https://api.moonshot.cn

# 沙箱 HTTP 域名白名单（宪法原则六；通配符 *.example.com 匹配裸域名与子域名）
http:
  allowed_domains:
    - wttr.in
    - api.github.com

# 核心能力三（US-3）：长期记忆后端选择（契约见 specs/003-agent-memory/contracts/memory-config.md）。
# 换后端只改 backend 一行，MemoryService 及以上代码零改动。
memory:
  backend: markdown           # markdown | sqlite | mem0
  archive-max-chars: 4000     # 归档区截断阈值（保留最新）；核心区不受此值影响
  # mem0:                     # 仅 backend=mem0 时需要；credential 走 ${ENV_VAR} 占位或 nivroos-secrets.yml
  #   url: http://localhost:8000
  #   api-key: ${MEM0_API_KEY}

logging:
  level:
    root: INFO
    # 日志格式/追加器见 logback-spring.xml（dev 彩色控制台+文件 / prod JSON）
