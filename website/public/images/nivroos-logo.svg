<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 180" role="img" aria-labelledby="title desc">
  <title id="title">NivroOS logo</title>
  <desc id="desc">A minimal black and white NivroOS logo with an abstract folded N mark and a bold wordmark.</desc>

  <!-- Optical centering compensates for the asymmetric mark-and-wordmark silhouette. -->
  <g transform="translate(40 0)">
    <!-- Abstract folded N mark: two solid ribbons create a compact, distinctive silhouette. -->
    <g fill="#FFFFFF">
      <path d="M28 143V42L47 23L116 92L98 110L64 76V124L46 142Z"/>
      <path d="M80 42L98 23L116 41V124L98 143L80 125Z"/>
    </g>

    <text x="150" y="128" fill="#FFFFFF" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="88" font-weight="700" letter-spacing="-4">NivroOS</text>
  </g>
</svg>
